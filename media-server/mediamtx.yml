# MediaMTX configuration for the Moodle mod_livestream plugin.
#
# Flow: OBS/Zoom publish RTMP to   rtmp://<domain>:1935/<streamkey>
#       Students play HLS from     https://<HLS_DOMAIN>/<streamkey>/index.m3u8
#
# HLS and playback are proxied (by Caddy) on their own separate subdomains,
# each at the proxy root — not one domain split by path — because MediaMTX's
# HLS server issues an absolute-path cookie-check redirect on the first
# request that a stripped path prefix breaks. See Caddyfile.
#
# In the docker-compose.yml shipped alongside this file, ports 8888
# (hlsAddress) and 9996 (playbackAddress) below are NOT published to the
# host — only the Caddy container can reach them, over the internal Docker
# network, and Caddy is what actually terminates HTTPS for students'
# browsers (see Caddyfile). Only 1935 (RTMP) is exposed directly, since raw
# RTMP can't be reverse-proxied by Caddy.
#
# The stream key is a 32-character random secret generated per activity by
# the plugin, so path secrecy is the access control for publishing and
# viewing — this is exactly why HTTPS end-to-end matters here.

logLevel: info

# --- RTMP ingest -------------------------------------------------------------
rtmp: yes
rtmpAddress: :1935

# --- HLS output --------------------------------------------------------------
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# Allow the Moodle page (different origin) to fetch the playlist and segments.
# '*' works everywhere with zero config; for tighter security once you know
# your real Moodle URL, restrict it instead, e.g.:
#   hlsAllowOrigins: ['https://moodle.example.com']
hlsAllowOrigins: ['*']

# --- Recording playback server ----------------------------------------------
# Serves finished recordings back over HTTP so Moodle can offer a
# "watch recording" link once a stream ends:
#   list one path's recordings:  GET /list?path=<streamkey>
#   download/stream a recording: GET /get?path=<streamkey>&start=<ISO8601>&duration=<sec>&format=mp4
playback: yes
playbackAddress: :9996

# --- Disable everything not needed ------------------------------------------
rtsp: no
webrtc: no
srt: no

# --- Recording defaults (apply to every path) -------------------------------
# Every published stream (OBS or a Zoom custom live stream) is written to disk
# so the lesson is kept after it ends. Files land under ./recordings on the
# host (bind-mounted to /recordings in the container). recordDeleteAfter: 0s
# keeps them forever — set a duration (e.g. 720h) to auto-prune old lessons.
pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s

# Accept any path (the plugin's random stream keys arrive as paths).
paths:
  all_others:
