services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: livestream-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (OBS publishes here)
      - "8888:8888"   # HLS playback (Moodle player reads here)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
